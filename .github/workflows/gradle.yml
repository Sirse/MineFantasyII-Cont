name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK (for Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup CI workspace
        run: ./gradlew setupCIWorkspace --stacktrace -S

      - name: Build
        run: ./gradlew build --stacktrace -S

      # The game tests (Horizon-QA) run on a development server; its reports are kept even when they fail
      - name: Game tests
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          ./gradlew runServer -PgameTests --stacktrace -S

      - name: Upload game test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: horizonqa-reports
          path: build/horizonqa/

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: build/libs/*.jar
