name: Release

on:
  push:
    tags:
      # Release tags carry the bare version, as every tag in this repository does: 2.8.14.6, 2.8.14.5u, 2.8.15.
      # The previous 'v*' pattern matched none of them, so this workflow had never run.
      - '[0-9]*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK (for Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup CI workspace
        run: ./gradlew setupCIWorkspace --stacktrace -S

      - name: Build
        run: ./gradlew build --stacktrace -S

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: build/libs/*.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
